{{- if .Values.tests.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mutx.fullname" . }}-test-connection
  labels:
    {{- include "mutx.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "mutx.componentSelectorLabels" (dict "root" . "component" "test") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: curl
          image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
          imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
          command: ["sh", "-ec"]
          args:
            - >-
              curl --fail --show-error --silent
              http://{{ include "mutx.fullname" . }}-api:{{ .Values.api.service.port }}/ready >/dev/null;
              curl --fail --show-error --silent
              http://{{ include "mutx.fullname" . }}-frontend:{{ .Values.frontend.service.port }}/ >/dev/null
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
{{- end }}
