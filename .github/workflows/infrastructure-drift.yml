name: Infrastructure Drift Detection

on:
  schedule:
    - cron: "30 5 * * *" # daily 05:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-drift
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  upstream-drift:
    name: Upstream metadata drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Compare registry with GitHub metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/check_upstream_drift.py
          --allow-drift
          --markdown-output "$GITHUB_STEP_SUMMARY"
          --json-output upstream-drift-report.json

      - name: Upload machine-readable report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-drift-report
          path: upstream-drift-report.json
          if-no-files-found: warn
          retention-days: 30

  readiness:
    name: Terraform drift readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report drift schedule state
        env:
          ENABLE_TERRAFORM_DRIFT: ${{ vars.ENABLE_TERRAFORM_DRIFT }}
          TRIGGER: ${{ github.event_name }}
        run: |
          if [ "$TRIGGER" = "schedule" ] && [ "$ENABLE_TERRAFORM_DRIFT" != "true" ]; then
            echo "::notice::Scheduled Terraform drift is disabled. Set ENABLE_TERRAFORM_DRIFT=true after configuring the required cloud and remote-state credentials."
          else
            echo "Terraform drift was explicitly requested or enabled."
          fi

  terraform-drift:
    name: Terraform drift (${{ matrix.environment }})
    needs: readiness
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_TERRAFORM_DRIFT == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
          - environment: production

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate required secrets
        run: |
          missing=0
          for var in TF_VAR_do_token AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing secret/env: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Materialize protected staging Terraform inputs
        if: matrix.environment == 'staging'
        env:
          TF_VARS: ${{ secrets.TF_VARS_STAGING }}
        run: |
          if [ -z "${TF_VARS}" ]; then
            echo "::error::Missing secret/env: TF_VARS_STAGING"
            exit 1
          fi
          umask 077
          printf '%s\n' "${TF_VARS}" > "${RUNNER_TEMP}/terraform-staging.tfvars"

      - name: Materialize protected production Terraform inputs
        if: matrix.environment == 'production'
        env:
          TF_VARS: ${{ secrets.TF_VARS_PRODUCTION }}
        run: |
          if [ -z "${TF_VARS}" ]; then
            echo "::error::Missing secret/env: TF_VARS_PRODUCTION"
            exit 1
          fi
          umask 077
          printf '%s\n' "${TF_VARS}" > "${RUNNER_TEMP}/terraform-production.tfvars"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false

      - name: Terraform init (remote backend)
        run: |
          terraform -chdir=infrastructure/terraform init \
            -reconfigure \
            -backend-config=environments/${{ matrix.environment }}/backend.hcl

      - name: Terraform plan (drift check)
        id: plan
        shell: bash
        run: |
          set +e
          terraform -chdir=infrastructure/terraform plan \
            -detailed-exitcode \
            -var-file="${RUNNER_TEMP}/terraform-${{ matrix.environment }}.tfvars"
          exit_code=$?
          set -e

          if [ "$exit_code" -eq 1 ]; then
            echo "Terraform plan failed"
            exit 1
          fi

          if [ "$exit_code" -eq 2 ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Drift detected in ${{ matrix.environment }}"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No drift detected in ${{ matrix.environment }}"
          fi

      - name: Fail on drift
        if: steps.plan.outputs.drift == 'true'
        run: |
          echo "Terraform drift detected in ${{ matrix.environment }}"
          exit 1
